)`,type:`range`,min:0,max:100,step:5,defaultValue:95,unit:`%`}],stepByStepGuide:[`確認黑色探棒插在電表下方中間的【COM】插孔，紅色探棒插在右側的【VΩmA】插孔。`,`將電表中央旋鈕轉至【V⎓ (直流電壓檔)】（直條線加虛線符號，手動量程通常選 20V 檔）。`,`將紅色探棒尖端碰觸電池的【+ 正極突起端】，黑色探棒碰觸【- 負極平底端】。`,`觀察螢幕讀數：全新的 1.5V 鹼性電池空載電壓約為 1.55V ~ 1.62V；若低於 1.20V 代表電量已耗盡。`,`點擊畫面上的【🔄 對調紅黑探棒】按鈕，觀察螢幕左方出現的「-」負號——這代表紅探棒所在位置的電位比黑探棒低！`],principles:[`數位三用電表在電壓檔 (DCV) 時，內部等效電阻高達 10MΩ（一千萬歐姆），因此並聯跨接在電池兩端時幾乎不抽取電流（僅約 0.15µA），不會造成電池短路。`,`直流電 (DC, Direct Current) 符號為一條直線下加三點虛線 (⎓)，代表電壓方向固定不隨時間反轉。`,`18650 鋰電池標稱 3.7V，但充飽電時應為 4.18V~4.20V；若放電低於 2.8V 屬於過度放電，可能永久損壞電芯。`],pitfalls:[`⚠️ 切勿在旋鈕轉到「mA」或「10A」電流檔（或紅探棒插在 10A 孔）時直接把探棒跨接在電池正負極！因為電流檔內阻趨近於 0Ω，等同用銅線直接短路電池，會瞬間燒斷電表保險絲甚至讓鋰電池發燙起火！`,`⚠️ 手動量程電表若選在 200mV (0.2V) 檔去量 9V 電池，螢幕會顯示「OL」或「1.」(Overload 超出量程)，需往上調到 20V 檔。`],formulasAndRef:[{title:`電位差定義 (Potential Difference)`,formula:`V_display = V_red - V_black`,explanation:`電表永遠計算「紅探棒電位減去黑探棒電位」，因此反接時數值大小不變、僅多出負號 (-)。`},{title:`常見電池健康電壓對照表`,formula:`AA滿電 ≈ 1.58V (沒電 <1.2V) ｜ 9V滿電 ≈ 9.4V ｜ 18650滿電 ≈ 4.20V`,explanation:`全新未拆封的鹼性電池電壓會略高於標稱值。`}],quizTarget:{question:`請將電表設定為正確檔位與插孔，並將紅探棒接電池正極 (+)、黑探棒接電池負極 (-) 量出正電壓值！`,expectedMode:`DCV`,expectedRedJack:`VOMA`,validPairs:[{red:`BAT_POS`,black:`BAT_NEG`,allowReverse:!1}],hint:`請轉至 V⎓ (DCV) 檔、紅探棒插 VΩmA 孔，紅探棒點選「電池 + 極」、黑探棒點選「電池 - 極」。`}},{id:`usb-mb102-rails`,chapter:`Lesson 02 · DCV`,title:`USB 5V 與 MB-102 麵包板電源模組量測`,subtitle:`驗證麵包板上下電源軌 5.0V / 3.3V 輸出與電源開關狀態`,category:`DCV`,difficulty:`入門`,guideRef:`對應 Gavin Jackson 01-Multimeter Mastery Step 3 (Measure USB & Breadboard Power)`,summary:`在把昂貴的 ESP32、Arduino 或感測器插上麵包板之前，資深玩家一定會先用三用電表確認 MB-102 電源模組輸出的正負軌是否真的是 5.0V 與 3.3V！透過本練習，你可以切換模組開關與跳帽，用探棒實測麵包板上下兩側紅藍電源軌的真實電壓。`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`YES (需通電量測)`,recommendedMode:`DCV`,recommendedRedJack:`VOMA`,defaultRedPointId:`RAIL_TOP_POS`,defaultBlackPointId:`RAIL_TOP_NEG`,testPoints:[{id:`RAIL_TOP_POS`,label:`上側紅色正電源軌 (+ Top Rail)`,shortLabel:`上軌 + (紅線)`,x:780,y:105,polarityHint:`+`,description:`由 MB-102 上方黃色跳帽決定輸出 5.0V 或 3.3V。整條橫排紅線孔位彼此導通。`},{id:`RAIL_TOP_NEG`,label:`上側藍色負電源軌 (- Top GND Rail)`,shortLabel:`上軌 - (藍線 GND)`,x:780,y:148,polarityHint:`-`,description:`麵包板上側共同接地軌 (0V GND)。黑探棒通常固定插在任一 GND 孔位。`},{id:`RAIL_BOT_POS`,label:`下側紅色正電源軌 (+ Bottom Rail)`,shortLabel:`下軌 + (紅線)`,x:780,y:332,polarityHint:`+`,description:`由 MB-102 下方黃色跳帽獨立設定為 3.3V 或 5.0V。可同時提供雙電壓給不同晶片！`},{id:`RAIL_BOT_NEG`,label:`下側藍色負電源軌 (- Bottom GND Rail)`,shortLabel:`下軌 - (藍線 GND)`,x:780,y:375,polarityHint:`-`,description:`麵包板下側共同接地軌 (0V GND)，在 MB-102 內部與上側 GND 共通。`}],simControls:[{id:`mbPowerOn`,label:`MB-102 白色電源鎖定開關 (Power Switch)`,type:`toggle`,defaultValue:1},{id:`topRailMode`,label:`上側電源軌跳帽設定 (Top Jumper)`,type:`select`,defaultValue:50,options:[{value:50,label:`5.0V 輸出 (Jumper -> 5V)`},{value:33,label:`3.3V 輸出 (Jumper -> 3.3V)`},{value:0,label:`拔除跳帽 OFF (斷開輸出)`}]},{id:`botRailMode`,label:`下側電源軌跳帽設定 (Bottom Jumper)`,type:`select`,defaultValue:33,options:[{value:33,label:`3.3V 輸出 (Jumper -> 3.3V)`},{value:50,label:`5.0V 輸出 (Jumper -> 5V)`}]}],stepByStepGuide:[`將電表轉至【V⎓ (直流電壓檔)】，確認 MB-102 電源模組開關為 ON（綠色電源指示燈亮起）。`,`將黑色探棒插入上側藍色【- (GND) 電源軌】，紅色探棒插入上側紅色【+ 電源軌】，驗證是否顯示約 5.02V。`,`保持黑探棒在 GND 不動，將紅探棒移至下側紅色【下軌 +】，觀察由 AMS1117-3.3 穩壓晶片輸出的 3.31V！`,`試著在下方模擬器切換「MB-102 電源開關」或更改「跳帽設定」，觀察電表讀數如何即時反應真實硬體狀態。`],principles:[`MB-102 麵包板電源模組內建兩顆低壓差線性穩壓器 (LDO)：AMS1117-5.0 與 AMS1117-3.3，可將 DC 6.5~12V 或 USB 5V 轉換為穩定的 5V 與 3.3V。`,`測量電路中任何一點的「電壓」時，黑探棒永遠可以固定插在系統的 GND（0V 基準點），只用紅探棒去點觸各個待測腳位即可，這稱為「單探棒巡檢法」。`],pitfalls:[`⚠️ 許多初學者把 5V 跳帽插在 ESP32 或 3.3V 感測器的供電軌上，沒量過就直接插晶片導致燒毀！通電前用電表花 3 秒鐘確認一次是最佳習慣。`,`⚠️ 部分大型 830 孔麵包板的紅藍電源軌在正中央（第 30 欄處）是斷開的！如果左半邊有電、右半邊量出 0V，代表需要用短跳線跨接中間斷點。`],formulasAndRef:[{title:`USB 標準供電規範 (UniRegensburg SWH)`,formula:`V_USB = 5.0V ± 5% (4.75V ~ 5.25V), I_max = 500mA (USB 2.0)`,explanation:`電腦 USB 埠標準電壓為 5.0V，一般帶有自復保險絲限制電流於 500mA~1A。`},{title:`3.3V 邏輯準位安全範圍`,formula:`V_3V3 = 3.30V ± 0.15V`,explanation:`ESP32、STM32、SD 卡與多數 I2C 模組皆使用 3.3V 供電。`}],quizTarget:{question:`請將紅黑探棒移到麵包板「下側電源軌 (+ 與 -)」，以直流電壓檔量出 3.3V 穩壓輸出！`,expectedMode:`DCV`,expectedRedJack:`VOMA`,validPairs:[{red:`RAIL_BOT_POS`,black:`RAIL_BOT_NEG`,allowReverse:!1},{red:`RAIL_BOT_POS`,black:`RAIL_TOP_NEG`,allowReverse:!1}],hint:`請選 V⎓ (DCV) 檔，紅探棒點選「下軌 + (紅線)」，黑探棒點選「下軌 -」或「上軌 -」(因為上下 GND 共通)。`}},{id:`resistor-pot-ohm`,chapter:`Lesson 03 · Ω`,title:`色碼電阻、可變電阻與人體電阻量測`,subtitle:`比對四環色碼電阻、旋轉 10kΩ 可變電阻滑臂、驗證斷電量測鐵律`,category:`OHM`,difficulty:`入門`,guideRef:`對應 Gavin Jackson Step 4 & UniRegensburg Tutorial 1 (Resistance & Potentiometer)`,summary:`電阻 (Ω) 就像是水管的狹窄程度，用來限制電流大小。三用電表的【Ω 電阻檔】會從探棒送出一股微小電流並量測壓降來算出歐姆值。因此有一條絕對鐵律：【測量電阻時，電路絕對不可通電！】此外，轉動三腳可變電阻 (Potentiometer) 的旋鈕，並分別量測左右腳與中間滑臂腳 (Wiper)，就能秒懂分壓旋鈕的內部構造！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`NO! (必須斷電量測)`,recommendedMode:`OHM`,recommendedRedJack:`VOMA`,defaultRedPointId:`RES_LEFT`,defaultBlackPointId:`RES_RIGHT`,testPoints:[{id:`RES_LEFT`,label:`色碼電阻左端引腳 (Resistor Lead A)`,shortLabel:`電阻左腳`,x:590,y:135,polarityHint:`node`,description:`精密金屬膜色碼電阻左腳。電阻沒有正負極之分，紅黑探棒對調讀數完全相同。`},{id:`RES_RIGHT`,label:`色碼電阻右端引腳 (Resistor Lead B)`,shortLabel:`電阻右腳`,x:860,y:135,polarityHint:`node`,description:`色碼電阻右腳。將紅黑探棒跨接於電阻左右兩腳即可讀取歐姆值。`},{id:`POT_PIN1`,label:`10kΩ 可變電阻 Pin 1 (左端固定腳 A)`,shortLabel:`可變電阻 Pin1`,x:615,y:345,polarityHint:`node`,description:`可變電阻碳膜軌道左端點。Pin 1 到 Pin 2 的阻值會隨旋鈕順時針轉動而增加！`},{id:`POT_PIN2`,label:`10kΩ 可變電阻 Pin 2 (中間滑臂腳 Wiper)`,shortLabel:`可變電阻 Pin2(中)`,x:725,y:345,polarityHint:`node`,description:`可變電阻中間游標滑臂 (Wiper)。調整下方旋鈕百分比，觀察 Pin1↔Pin2 與 Pin2↔Pin3 阻值消長！`},{id:`POT_PIN3`,label:`10kΩ 可變電阻 Pin 3 (右端固定腳 B)`,shortLabel:`可變電阻 Pin3`,x:835,y:345,polarityHint:`node`,description:`可變電阻碳膜軌道右端點。Pin 1 與 Pin 3 之間永遠是固定的總電阻 (10.0 kΩ)。`}],simControls:[{id:`resistorOhms`,label:`選擇待測四環色碼電阻規格`,type:`select`,defaultValue:1e3,options:[{value:220,label:`220 Ω (紅-紅-棕-金) — LED 常用限流電阻`},{value:1e3,label:`1.0 kΩ (棕-黑-紅-金) — 經典基準電阻`},{value:4700,label:`4.7 kΩ (黃-紫-紅-金) — I2C/DHT11 上拉電阻`},{value:1e4,label:`10 kΩ (棕-黑-橘-金) — 按鈕上拉/下拉電阻`},{value:1e5,label:`100 kΩ (棕-黑-黃-金) — 高阻抗分壓電阻`},{value:1e6,label:`1.0 MΩ (棕-黑-綠-金) — 極高阻值 (小心手指並聯!)`}]},{id:`potTurnPct`,label:`旋轉 B10K 可變電阻旋鈕角度 (0% ~ 100%)`,type:`range`,min:0,max:100,step:5,defaultValue:35,unit:`%`},{id:`fingersTouching`,label:`模擬「雙手手指同時捏住兩端金屬腳」(並聯人體電阻 ~300kΩ)`,type:`toggle`,defaultValue:0},{id:`circuitPowered`,label:`錯誤示範：在電路仍通電 (Power ON) 狀態下量電阻`,type:`toggle`,defaultValue:0}],stepByStepGuide:[`將電表中央旋鈕轉至綠色【Ω (電阻檔)】，確認待測元件已完全脫離電源（斷電狀態）。`,`將紅黑探棒分別接觸上方色碼電阻的【電阻左腳】與【電阻右腳】（電阻無極性，正反接皆可）。`,`切換下方「色碼電阻規格」為 1.0 MΩ，接著開啟「模擬雙手手指同時捏住金屬腳」開關：觀察讀數瞬間掉到約 230 kΩ！這就是為什麼量高阻值電阻時手絕對不能同時碰觸兩端金屬探針。`,`將紅探棒移到下方可變電阻【Pin1】、黑探棒移到中間腳【Pin2(中)】，拉動「可變電阻旋鈕角度」滑桿，觀察阻值如何在 0Ω ~ 10kΩ 之間線性變化！`],principles:[`色碼電阻口訣（棕1、紅2、橘3、黃4、綠5、藍6、紫7、灰8、白9、黑0）：以四環電阻「棕-黑-紅-金」為例，前兩環「10」乘上第三環倍率「10² (100)」= 1000Ω = 1.0kΩ，第四環金色代表 ±5% 誤差範圍。`,`可變電阻 (Potentiometer) 內部是一條總阻值 10kΩ 的圓弧形碳膜（連接 Pin 1 與 Pin 3），中間腳 Pin 2 則是隨轉軸滑動的金屬刷 (Wiper)，因此 R(1-2) + R(2-3) 恆等於總阻值 10kΩ。`,`人體皮膚乾燥時電阻約為 100kΩ ~ 500kΩ。若雙手手指同時捏住 1MΩ 電阻兩端與探針，電表量到的是「1MΩ 與人體 300kΩ 並聯」後的等效電阻 (約 231kΩ)，造成嚴重低估！`],pitfalls:[`⚠️ 絕對禁止在電路通電時使用電阻檔 (Ω)！外部電壓會灌入電表內部的恆流源量測電路，不僅讀數完全錯誤，還可能燒毀電表內部保護元件。`,`⚠️ 若電阻已經焊在電路板上，直接量測常會因為板子上有其他元件與它並聯而導致讀數偏低；最準確的做法是至少將電阻的一隻腳拔離麵包板再量。`],formulasAndRef:[{title:`並聯電阻公式（手指觸碰誤差來源）`,formula:`R_total = (R_part × R_body) / (R_part + R_body)`,explanation:`當 1000kΩ 電阻並聯 300kΩ 人體電阻時，等效阻值驟降為 230.8kΩ。`},{title:`可變電阻兩段阻值關係`,formula:`R_13 = 10kΩ (固定) ｜ R_12 = θ × 10kΩ ｜ R_23 = (1 - θ) × 10kΩ`,explanation:`θ 為旋鈕轉動比例 (0.0 ~ 1.0)。`}],quizTarget:{question:`請在「斷電狀態」下，用電阻檔 (Ω) 量測可變電阻「左腳 Pin1」與「中間滑臂腳 Pin2」之間的阻值！`,expectedMode:`OHM`,expectedRedJack:`VOMA`,validPairs:[{red:`POT_PIN1`,black:`POT_PIN2`,allowReverse:!0}],hint:`請轉至 Ω 檔（確認下方錯誤通電開關為關閉），將兩支探棒分別點在「可變電阻 Pin1」與「可變電阻 Pin2(中)」。`}},{id:`continuity-beep-game`,chapter:`Lesson 04 · 🔊`,title:`導通蜂鳴檔：麵包板尋線遊戲與抓出斷芯杜邦線`,subtitle:`Gavin Jackson 經典「Beep Game」— 聽嗶聲秒懂麵包板內部銅片與杜邦線好壞`,category:`CONT`,difficulty:`入門`,guideRef:`對應 Gavin Jackson 01-Multimeter Mastery Step 5 & Step 6 (The Beep Game)`,summary:`當你照著教學接好麵包板，電路卻完全沒反應時，90% 是因為插錯排、跨過了中央凹槽、或是拿到一條外表完好但內部銅線斷裂的「黑心杜邦線」！把電表轉到【🔊 導通蜂鳴檔】，只要兩探棒間電阻小於約 30Ω，電表就會立刻發出清脆的「嗶—」聲，讓你不用看螢幕也能快速尋線除錯！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`NO! (必須斷電量測)`,recommendedMode:`CONT`,recommendedRedJack:`VOMA`,defaultRedPointId:`BB_A1`,defaultBlackPointId:`BB_E1`,testPoints:[{id:`BB_A1`,label:`麵包板孔位 A1 (左半排第 1 欄頂端)`,shortLabel:`孔位 A1`,x:565,y:120,polarityHint:`node`,description:`麵包板第 1 欄上半部孔位。內部有五孔連通彈片與 B1、C1、D1、E1 相連！`},{id:`BB_E1`,label:`麵包板孔位 E1 (左半排第 1 欄中央凹槽旁)`,shortLabel:`孔位 E1`,x:685,y:120,polarityHint:`node`,description:`與 A1 同屬第 1 欄上半部 5 孔銅片，因此與 A1 量測會發出「嗶—」導通聲 (<0.2Ω)！`},{id:`BB_F1`,label:`麵包板孔位 F1 (跨過中央凹槽的下半排)`,shortLabel:`孔位 F1 (跨凹槽)`,x:785,y:120,polarityHint:`node`,description:`位於中央 DIP 凹槽另一側！與 E1 之間是斷開絕緣的，量測 A1↔F1 不會響 (OL)。`},{id:`BB_A2`,label:`麵包板孔位 A2 (隔壁第 2 欄)`,shortLabel:`孔位 A2 (隔壁欄)`,x:565,y:185,polarityHint:`node`,description:`不同欄 (Column 1 vs Column 2) 彼此完全絕緣，因此 A1↔A2 絕對不導通！`},{id:`WIRE_GOOD_L`,label:`藍色正常杜邦線 — 左端針腳`,shortLabel:`正常線(左)`,x:575,y:285,polarityHint:`node`,description:`良好杜邦線的左端金屬針。與右端量測應立即發出嗶聲。`},{id:`WIRE_GOOD_R`,label:`藍色正常杜邦線 — 右端針腳`,shortLabel:`正常線(右)`,x:895,y:285,polarityHint:`node`,description:`良好杜邦線的右端金屬針。`},{id:`WIRE_BAD_L`,label:`黃色嫌疑杜邦線 (Suspect Wire) — 左端針腳`,shortLabel:`嫌疑線(左)`,x:575,y:358,polarityHint:`node`,description:`外觀看似正常、但內部壓接處已斷裂的故障杜邦線左端。`},{id:`WIRE_BAD_R`,label:`黃色嫌疑杜邦線 (Suspect Wire) — 右端針腳`,shortLabel:`嫌疑線(右)`,x:895,y:358,polarityHint:`node`,description:`與嫌疑線左端量測時，可調整下方「故障線狀態」測試斷路 (OL 不響) 與接觸不良！`}],simControls:[{id:`suspectWireFault`,label:`黃色嫌疑杜邦線內部狀態 (Suspect Jumper Status)`,type:`select`,defaultValue:1,options:[{value:1,label:`內部銅芯完全斷裂 (Open Circuit -> OL 不會響!)`},{value:2,label:`壓接氧化接觸不良 (85 Ω 高阻抗 -> 有阻值但不響!)`},{value:0,label:`已更換為良品杜邦線 (0.15 Ω -> 正常嗶聲導通!)`}]}],stepByStepGuide:[`將電表中央旋鈕轉至【🔊 (導通蜂鳴檔)】（面板右上角可開啟/靜音真實 WebAudio 蜂鳴器音效）。`,`【挑戰 1：麵包板 Beep Game】將紅探棒留在【孔位 A1】，用黑探棒分別點觸【孔位 E1】（同排導通嗶聲！）、【孔位 F1】（跨中央凹槽不響 OL）、以及【孔位 A2】（不同欄不響 OL）。`,`【挑戰 2：抓出害你除錯兩小時的斷芯杜邦線】將紅黑探棒接在【正常線(左) ↔ 正常線(右)】聽聽看清脆嗶聲；接著移到【嫌疑線(左) ↔ 嫌疑線(右)】，發現螢幕顯示 OL 且完全不響，立刻抓出故障線！`],principles:[`導通蜂鳴檔 (Continuity) 本質上是高速反應的「低電阻檔」：當兩端阻值低於約 30Ω~50Ω 時，內建壓電蜂鳴器立刻鳴叫，讓工程師眼睛盯著密集的電路板針腳時，單靠耳朵就能確認有沒有接通。`,`麵包板內部結構：每一欄的 A-B-C-D-E 五個孔夾著同一片磷青銅彈片，F-G-H-I-J 五個孔夾著另一片；正中央的凹槽 (Ravine) 則是為了讓雙列直插 IC (DIP) 或按鈕跨接而刻意斷開的。`],pitfalls:[`⚠️ 絕對不可在電路通電時使用導通蜂鳴檔！通電中的電位差會讓蜂鳴器亂叫一通（假導通）或完全不叫。`,`⚠️ 如果你用導通檔去量一顆 1kΩ 電阻，電表不會叫（因為 1000Ω > 30Ω 門檻），這不代表電阻壞掉，而是必須超過蜂鳴門檻才會顯示 OL。`],formulasAndRef:[{title:`導通蜂鳴觸發條件`,formula:`R_measured < 30 Ω  ⇒  🔊 BEEP ON!`,explanation:`良導體（銅線、焊點、麵包板同一排彈片）電阻通常僅 0.05Ω ~ 0.3Ω。`}],quizTarget:{question:`請轉到導通蜂鳴檔 (🔊)，並將紅黑探棒接在「黃色嫌疑杜邦線」的左右兩端，檢測它的內部狀態！`,expectedMode:`CONT`,expectedRedJack:`VOMA`,validPairs:[{red:`WIRE_BAD_L`,black:`WIRE_BAD_R`,allowReverse:!0}],hint:`請選 🔊 (CONT) 檔，將紅探棒與黑探棒分別點選「嫌疑線(左)」與「嫌疑線(右)」。`}},{id:`diode-led-polarity`,chapter:`Lesson 05 · ➔|`,title:`二極體檔：LED 正負極判別、順向壓降 Vf 與微亮測試`,subtitle:`用電表直接點亮紅/綠/藍光 LED 並讀出 1.9V~3.2V 順向導通壓降`,category:`DIODE`,difficulty:`入門`,guideRef:`對應 Gavin Jackson Step 8 (Diode mode LED test) & UniRegensburg LED Reference Values`,summary:`LED（發光二極體）的腳如果被剪短了，怎麼分正負極？只要把三用電表轉到【➔| 二極體測試檔】，電表內部會送出約 1.5mA 的安全恆定電流。當紅探棒接陽極 (+ 長腳)、黑探棒接陰極 (- 短腳/缺口平面側) 時，畫面上的 LED 會真的微亮起來，同時螢幕會顯示該顏色 LED 的順向導通電壓 Vf（紅光約 1.9V、綠光約 2.1V、藍白光約 3.2V）！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`NO! (必須斷電量測)`,recommendedMode:`DIODE`,recommendedRedJack:`VOMA`,defaultRedPointId:`LED_ANODE`,defaultBlackPointId:`LED_CATHODE`,testPoints:[{id:`LED_ANODE`,label:`LED 陽極長腳 (+ Anode)`,shortLabel:`LED 陽極 (+長腳)`,x:590,y:195,polarityHint:`+`,description:`LED 正極（長腳，內部支架較小）。二極體檔紅探棒接此腳、黑探棒接陰極即可點亮 LED！`},{id:`LED_CATHODE`,label:`LED 陰極短腳 / 平邊 (- Cathode)`,shortLabel:`LED 陰極 (-短腳)`,x:700,y:195,polarityHint:`-`,description:`LED 負極（短腳，燈罩底部有平面切邊 Flat side，內部反射碗支架較大）。`},{id:`DIODE_ANODE`,label:`1N4148 / 1N4007 矽二極體 陽極 (+ 無色環端)`,shortLabel:`二極體 陽極(+)`,x:610,y:345,polarityHint:`+`,description:`一般整流/訊號二極體正極。順向導通壓降約為 0.62V ~ 0.68V。`},{id:`DIODE_CATHODE`,label:`1N4148 / 1N4007 矽二極體 陰極 (- 銀/黑色環端)`,shortLabel:`二極體 陰極(-色環)`,x:865,y:345,polarityHint:`-`,description:`二極體印有環狀條紋的一端代表陰極 (-)，象徵二極體符號「➔|」前面的那條垂直擋線。`}],simControls:[{id:`ledColorType`,label:`切換待測 LED 發光顏色 (影響能隙與順向壓降 Vf)`,type:`select`,defaultValue:0,options:[{value:0,label:`🔴 紅光 LED (Red AlGaAs, Vf ≈ 1.90V)`},{value:1,label:`🟡 黃光 LED (Yellow GaAsP, Vf ≈ 2.02V)`},{value:2,label:`🟢 綠光 LED (Green GaP/InGaN, Vf ≈ 2.15V)`},{value:3,label:`🔵 藍光 LED (Blue InGaN, Vf ≈ 3.15V)`},{value:4,label:`⚪ 白光 LED (White Blue+Phosphor, Vf ≈ 3.25V)`}]}],stepByStepGuide:[`將電表中央旋鈕轉至粉紅色【➔| (二極體測試檔)】。`,`將紅探棒點選【LED 陽極 (+長腳)】、黑探棒點選【LED 陰極 (-短腳)】：觀察上方 LED 燈珠發出光芒，且電表顯示約 1.90V 的順向壓降 (Vf)！`,`切換下方「待測 LED 發光顏色」從紅光依序換到黃光、綠光、藍光：觀察波長越短（能量越高）的光，所需的順向導通電壓 Vf 越高（藍白光高達 3.15V~3.25V）！`,`點擊【🔄 對調紅黑探棒】測試逆向偏壓：此時二極體截止不導電，LED 熄滅且電表顯示「OL」，證明二極體是只准電流單向通過的單向閥！`],principles:[`UniRegensburg 教材重點提醒：【LED 不遵守歐姆定律 (LEDs do not follow Ohm’s Law)】！當跨壓低於順向閾值 Vf 時電流幾乎為 0；一旦超過 Vf，電壓只要微幅增加 0.1V，電流就會呈指數暴增並瞬間燒毀 LED，因此實務上永遠必須串聯限流電阻。`,`二極體測試檔為什麼用「伏特 (V)」當單位？因為電表輸出約 1mA 恆流源流過待測二極體，量測到的正是該 PN 接面導通時的「順向壓降 (Forward Voltage, Vf)」。`],pitfalls:[`⚠️ 為什麼用「Ω 電阻檔」量 LED 常會顯示 OL？因為一般電阻檔為了省電，測試電壓往往低於 1.0V，根本不足以跨過 LED 的 1.9V~3.2V 導通門檻！測 LED 與二極體一定要轉到專用的「➔| 二極體檔」。`,`⚠️ 部分舊款廉價三用電表的二極體檔開路電壓只有 2.5V，點得亮紅/綠光 LED，卻點不亮需要 3.2V 的藍光與白光 LED（像 FNIRSI DMT-99 這類現代電表則提供 >3.5V 測試電壓，可輕鬆點亮藍白光 LED）。`],formulasAndRef:[{title:`UniRegensburg 教材 LED 順向壓降參考表 (I = 20mA)`,formula:`紅光 1.9V ｜ 黃光 2.0V ｜ 綠光 2.1V ｜ 藍/白光 3.2~3.4V ｜ 矽二極體 0.65V`,explanation:`知道了 LED 的 Vf，就能用 R = (V_supply - Vf) / 0.02A 算出完美的限流電阻值！`}],quizTarget:{question:`請使用二極體檔 (➔|) 正確連接紅黑探棒，讓畫面上的 LED 順向導通發亮並測出 Vf！`,expectedMode:`DIODE`,expectedRedJack:`VOMA`,validPairs:[{red:`LED_ANODE`,black:`LED_CATHODE`,allowReverse:!1}],hint:`請選 ➔| (DIODE) 檔，紅探棒接「LED 陽極 (+長腳)」、黑探棒接「LED 陰極 (-短腳)」。`}},{id:`capacitance-safe-discharge`,chapter:`Lesson 06 · ⊣⊢`,title:`電容檔：電解電容容量測試與 1kΩ 安全放電實務`,subtitle:`測量 0.1µF、10µF、1000µF 電容，體驗未放電直接量測的高壓風險`,category:`CAP`,difficulty:`入門`,guideRef:`對應 Gavin Jackson 01-Multimeter Mastery Step 7 (Measure capacitance & Safe discharge)`,summary:`電容器就像是電路裡的「迷你蓄水池」，斷電後內部仍可能殘留電荷！Gavin Jackson 教材特別強調：在把三用電表轉到【⊣⊢ 電容檔】量測大電容（如 100µF、1000µF）之前，必須先用一顆 1kΩ 電阻跨接在電容兩腳 5 秒鐘進行安全放電。本練習讓你親手操作「先放電、再量測」的標準程序！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`NO! (必須斷電量測)`,recommendedMode:`CAP`,recommendedRedJack:`VOMA`,defaultRedPointId:`CAP_POS`,defaultBlackPointId:`CAP_NEG`,testPoints:[{id:`CAP_POS`,label:`電解電容正極長腳 (+ Anode Lead)`,shortLabel:`電容 + 極 (長腳)`,x:640,y:255,polarityHint:`+`,description:`鋁質電解電容正極（長腳，無白色條紋側）。量測時建議將紅探棒接於正極。`},{id:`CAP_NEG`,label:`電解電容負極短腳 (- 白色條紋側 Stripe)`,shortLabel:`電容 - 極 (白條紋)`,x:785,y:255,polarityHint:`-`,description:`鋁質電解電容負極（外殼印有明顯灰白色「- - -」負號條紋與短腳）。`}],simControls:[{id:`capNominalUf`,label:`選擇待測電容器規格 (Nominal Capacitance)`,type:`select`,defaultValue:10,options:[{value:.1,label:`0.1 µF (100 nF 104 陶瓷去耦電容 — 無極性)`},{value:10,label:`10 µF / 25V (鋁質電解電容 — 有極性)`},{value:100,label:`100 µF / 16V (電源濾波電解電容)`},{value:1e3,label:`1000 µF / 25V (大容量儲能電解電容)`}]},{id:`capDischarged`,label:`⚡ 已使用 1kΩ 電阻跨接電容兩腳完成安全放電 (Safe Discharge)`,type:`toggle`,defaultValue:1}],stepByStepGuide:[`將電表中央旋鈕轉至紫色【⊣⊢ (電容檔)】。`,`確認下方「已使用 1kΩ 電阻完成安全放電」為開啟狀態（或直接點擊畫布上的【⚡ 點擊用 1kΩ 電阻放電】按鈕）。`,`將紅探棒接【電容 + 極 (長腳)】、黑探棒接【電容 - 極 (白條紋)】，讀取電容量（例如 10.2 µF 或 980 µF）。`,`試著把下方「安全放電」開關關閉（模擬剛從通電電路拔下來、還殘留 12V 電荷的電容）：觀察電表立刻發出高壓殘電警報！這就是實務上燒毀電表電容檔的頭號元兇。`],principles:[`三用電表如何量電容？電表內部會用已知的微小恆定電流對電容充電，並測量電壓上升所需的時間常數 (τ = R × C)，藉此換算出電容量 (F)。因此測量 1000µF 大電容時，真實電表通常需要等待 2~4 秒才出數值。`,`鋁質電解電容具有嚴格極性：外殼側面有一道明顯的白色或金色直條紋，上面印有「-」號，且引腳較短，代表負極 (Cathode)。在實際電路中若正負極插反通電，電解液受熱氣化會導致電容頂部防爆紋裂開甚至爆漿！`,`一般電解電容的出廠誤差高達 ±20%，因此標示 1000µF 的電容實測在 850µF ~ 1150µF 之間都屬於正常良品。`],pitfalls:[`⚠️ 測量電容前「務必先放電」！小電容可用螺絲起子短接兩腳，大容量或高壓電容則應透過 1kΩ 電阻跨接放電 5 秒，避免瞬間大火花傷手或燒毀電表。`],formulasAndRef:[{title:`電容單位換算與 RC 時間常數 (Lesson 1.4)`,formula:`1 µF = 1,000 nF = 1,000,000 pF ｜ τ = R × C`,explanation:`例如 1kΩ 電阻配 1000µF 電容，時間常數 τ = 1000 × 0.001 = 1.0 秒（約 5τ = 5 秒完全放完電）。`}],quizTarget:{question:`請確認電容已完成安全放電，並使用電容檔 (⊣⊢) 正確連接電解電容正負極量出容量！`,expectedMode:`CAP`,expectedRedJack:`VOMA`,validPairs:[{red:`CAP_POS`,black:`CAP_NEG`,allowReverse:!1}],hint:`請選 ⊣⊢ (CAP) 檔、確認已開啟「安全放電」，紅探棒接「電容 + 極」、黑探棒接「電容 - 極」。`}},{id:`series-current-ohms-law`,chapter:`Lesson 07 · mA⎓`,title:`串聯電流檔：歐姆定律實證與燒保險絲防呆演練`,subtitle:`把電路「剪開」將電表串入 LED 迴路量測 mA，並體驗誤並聯電源燒斷保險絲！`,category:`CURRENT`,difficulty:`進階`,guideRef:`對應 UniRegensburg Tutorial 1 (Current in Series, Ohm’s Law) & Gavin Jackson Lesson 1.1`,summary:`量電壓要「並聯」，但量電流絕對要「串聯 (In Series)」！因為電流就像水管裡的水流流量，你必須把水管剪開，讓所有的水都流過水錶（電表內部），才能測出幾毫安培 (mA)。本課完整重現 UniRegensburg Tutorial 1 與 Gavin Jackson Lesson 1.1 的經典實驗：5V 電源 + 限流電阻 + 紅光 LED，並讓你親眼看看如果不小心把電流檔「並聯」在電源正負極，電表內部的保險絲是如何瞬間燒斷的！`,connectionType:`串聯 (In Series)`,canCircuitBePowered:`YES (需通電量測)`,recommendedMode:`DCMA`,recommendedRedJack:`VOMA`,defaultRedPointId:`SER_BREAK_A`,defaultBlackPointId:`SER_BREAK_B`,testPoints:[{id:`SER_VCC_5V`,label:`5.0V 電源正極輸出端 (+5V Source)`,shortLabel:`+5V 電源端`,x:545,y:165,polarityHint:`+`,description:`5V 直流電源正極，連接至限流電阻左端。`},{id:`SER_BREAK_A`,label:`串聯斷開點 A (電阻右端 — 電流流出端)`,shortLabel:`斷開點 A (電阻端)`,x:715,y:165,polarityHint:`+`,description:`我們在電阻與 LED 之間把導線「拔開」形成的上游端點！串聯測電流時【紅探棒】應接此處。`},{id:`SER_BREAK_B`,label:`串聯斷開點 B (LED 陽極 — 電流流入端)`,shortLabel:`斷開點 B (LED端)`,x:845,y:165,polarityHint:`-`,description:`拔開導線的下游端點（LED 正極）。串聯測電流時【黑探棒】應接此處，讓電流流過電表點亮 LED！`},{id:`SER_GND`,label:`電源負極接地端 (0V GND)`,shortLabel:`GND 負極端`,x:680,y:345,polarityHint:`-`,description:`⚠️ 危險警告：若在電流檔 (mA/10A) 將探棒直接跨接【+5V 電源端 ↔ GND】，會造成電源直接短路並燒斷電表保險絲！`}],simControls:[{id:`supplyVolts`,label:`直流電源供應電壓 U (Supply Voltage)`,type:`range`,min:3,max:9,step:.5,defaultValue:5,unit:`V`},{id:`seriesResistor`,label:`串聯限流電阻 R (Current Limiting Resistor)`,type:`select`,defaultValue:220,options:[{value:150,label:`150 Ω (5V 時約 20.0 mA — LED 最亮安全上限)`},{value:220,label:`220 Ω (5V 時約 13.6 mA — 教材標準保護值)`},{value:470,label:`470 Ω (5V 時約 6.4 mA — 柔和省電亮度)`},{value:1e3,label:`1.0 kΩ (5V 時約 3.1 mA — 微亮指示燈)`}]}],stepByStepGuide:[`觀察中間畫布：為了測量流過 LED 的電流，我們沒有把電阻直接連到 LED，而是刻意留出了【斷開點 A】與【斷開點 B】缺口。`,`將電表旋鈕轉至橘色【mA⎓ (直流毫安培檔)】，紅探棒維持在【VΩmA】孔。`,`將紅探棒接【斷開點 A (電阻端)】、黑探棒接【斷開點 B (LED端)】：此時電流從 +5V → 經過 220Ω 電阻 → 從紅探棒流進電表內部 → 從黑探棒流出進入 LED → 回到 GND！LED 瞬間亮起，電表顯示約 13.6 mA！`,`拉動下方滑桿改變「電源電壓 U」或「限流電阻 R」，觀察歐姆定律 I = (U - 2.0V) / R 與 LED 亮度的同步變化。`,`【💥 防呆震撼教育】試著把紅探棒移去點【+5V 電源端】、黑探棒點【GND 負極端】（也就是把電流檔當成電壓檔直接並聯在電源兩端）：觀察保險絲瞬間燒斷 (FUSE BLOWN) 的短路警告！看完後可點「🔧 更換保險絲」復原。`],principles:[`歐姆定律 (Ohm’s Law)：I = U_R / R。在 5.0V 電源串聯 220Ω 電阻與紅光 LED (順向壓降 Vf ≈ 2.0V) 的電路中，跨在電阻上的電壓 U_R = 5.0V - 2.0V = 3.0V，因此迴路電流 I = 3.0V / 220Ω ≈ 0.01364A = 13.64 mA。`,`電阻發熱功率 (UniRegensburg Tutorial 1)：P = U_R × I = 3.0V × 0.01364A ≈ 0.041 W (41 mW)，遠低於一般色碼電阻的 0.25W (1/4W) 額定功率上限，因此不會發燙燒毀。`,`為什麼電流檔並聯電源會燒錶？因為理想電流表不能阻礙原本的水流，所以電表在 mA/10A 檔位時內部電阻趨近於 0Ω（就像一條粗銅線）。直接跨接在 5V 與 GND 之間時，根據 I = U / R，電流會瞬間飆破數安培，立刻熔斷電表內部的 400mA 保險絲！`],pitfalls:[`⚠️ 記住口訣：「量電壓並聯跨兩端、量電流剪開串中間」！`,`⚠️ 若待測電流超過 400mA（例如測量馬達或 1Ω 大電流負載），必須先將紅探棒改插到左側的【10A】專用插孔，並將旋鈕轉至【10A⎓】檔。`],formulasAndRef:[{title:`LED 限流電阻與串聯電流公式 (Gavin Jackson Lesson 1.1)`,formula:`I = (V_supply - V_LED) / R   ⇒   (5.0V - 2.0V) / 220Ω = 13.64 mA`,explanation:`串聯迴路中各處電流完全相等，因此電表串在電阻前或電阻後量到的 mA 完全一樣。`},{title:`電功率與發熱公式 (UniRegensburg Tutorial 1)`,formula:`P = U × I = U² / R = I² × R  (單位：瓦特 W)`,explanation:`一般 1/4W 電阻最大承受 0.25W；若把 5V 直接加在 1Ω 電阻上，P = 25W 會瞬間冒煙燒毀！`}],quizTarget:{question:`請用毫安培電流檔 (mA⎓) 將紅黑探棒「串聯」接入斷開點 A 與斷開點 B，完成迴路並點亮 LED！`,expectedMode:`DCMA`,expectedRedJack:`VOMA`,validPairs:[{red:`SER_BREAK_A`,black:`SER_BREAK_B`,allowReverse:!1}],hint:`請選 mA⎓ (DCMA) 檔、紅探棒插 VΩmA（若保險絲已燒斷請先點擊更換保險絲），紅探棒點「斷開點 A」、黑探棒點「斷開點 B」。`}},{id:`circuit-voltage-drop`,chapter:`Lesson 08 · DCV`,title:`帶電電路壓降診斷：按鈕、電阻與 LED 跨壓巡檢`,subtitle:`不用拆電路！用直流電壓檔單探棒巡檢各節點電位，秒抓按鈕接觸不良與分壓關係`,category:`DCV`,difficulty:`進階`,guideRef:`對應 UniRegensburg Tutorial 1 (Button + 220Ω + LED Circuit) & Gavin Jackson Lesson 1.2/1.3`,summary:`在真實電路除錯時，我們很少剪開線路量電流，而是把電表轉到【V⎓ 直流電壓檔】，黑探棒固定夾在 GND，用紅探棒依序點觸「電源端 → 按鈕輸出端 → 電阻與 LED 交界處」，或是直接跨接在單一元件兩端量測「元件跨壓 (Voltage Drop)」。透過克希荷夫電壓定律 (KVL)，5.0V 電源剛好會等於電阻跨壓 (3.0V) 加上 LED 跨壓 (2.0V)！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`YES (需通電量測)`,recommendedMode:`DCV`,recommendedRedJack:`VOMA`,defaultRedPointId:`NODE_MID`,defaultBlackPointId:`NODE_GND`,testPoints:[{id:`NODE_VCC`,label:`節點 TP1：+5.0V 電源輸入與按鈕左端`,shortLabel:`TP1 (+5V輸入)`,x:535,y:170,polarityHint:`+`,description:`恆定 5.00V 電源正極。相對於 GND 永遠應量到 5.00V。`},{id:`NODE_SW_OUT`,label:`節點 TP2：微動按鈕右端 (與 220Ω 電阻左端)`,shortLabel:`TP2 (按鈕後)`,x:685,y:170,polarityHint:`node`,description:`當按鈕按下時應導通為 5.00V；若按鈕未按（開路），此點被下游拉至 0.00V。`},{id:`NODE_MID`,label:`節點 TP3：220Ω 電阻右端與 LED 陽極交界處`,shortLabel:`TP3 (電阻/LED間)`,x:855,y:170,polarityHint:`node`,description:`按鈕按下時，5V 經過 220Ω 降壓 3.0V 後，此節點對 GND 電位正好是 LED 的順向壓降 2.00V！`},{id:`NODE_GND`,label:`節點 TP4：LED 陰極與系統 0V 共地端 (GND)`,shortLabel:`TP4 (0V GND)`,x:700,y:350,polarityHint:`-`,description:`系統 0V 基準地 (Ground)。巡檢電路電位時，建議將黑探棒固定留在 TP4。`}],simControls:[{id:`buttonClosed`,label:`按壓電路上的微動按鈕開關 (Push Button State)`,type:`toggle`,defaultValue:1},{id:`faultMode`,label:`注入模擬電路故障 (Troubleshooting Challenge)`,type:`select`,defaultValue:0,options:[{value:0,label:`正常運作 (按下按鈕時：V_R = 3.0V, V_LED = 2.0V)`},{value:1,label:`故障 A：微動按鈕內部氧化斷路 (按下後 TP2 仍為 0V)`},{value:2,label:`故障 B：LED 腳位虛焊開路 (TP3 飆升至 5.0V 且 LED 不亮!)`}]}],stepByStepGuide:[`確認旋鈕在【V⎓ (直流電壓檔)】，且下方「按壓微動按鈕開關」為 ON（按下導通狀態）。`,`【測法 A：對地電位巡檢】將黑探棒固定在【TP4 (0V GND)】，用紅探棒依序點選【TP1 (+5V輸入)】(5.00V) →【TP2 (按鈕後)】(5.00V) →【TP3 (電阻/LED間)】(2.00V)。`,`【測法 B：單一元件跨壓】將紅探棒點【TP2 (按鈕後)】、黑探棒點【TP3 (電阻/LED間)】，直接量出跨在 220Ω 電阻兩端的電壓降 V_R = 3.00V！`,`【故障診斷實戰】將下方「注入模擬電路故障」切換為「故障 B：LED 腳位虛焊開路」：因為沒有電流流過 220Ω 電阻（I=0 ⇒ V_R = I×R = 0V），此時量 TP3 對 GND 會發現電壓從 2.0V 異常變成 5.00V！工程師一看就知道是 TP3 下游（LED 端）開路了！`],principles:[`克希荷夫電壓定律 (Kirchhoff’s Voltage Law, KVL)：在封閉串聯迴路中，電源提供的總電壓 (5.0V) 必定等於各元件跨壓的總和：V_switch (0V) + V_resistor (3.0V) + V_LED (2.0V) = 5.0V。`,`為什麼「開路點」會承受全部的電源電壓？當按鈕未按下（開路）時，迴路電流 I = 0A，因此電阻與 LED 上都沒有壓降，全部 5.0V 電位差都會落在斷開的按鈕兩端（TP1 ↔ TP2 量到 5.0V）。`],pitfalls:[`⚠️ 為什麼 Gavin Jackson Lesson 1.2 說「把 3 顆紅光 LED 直接串聯在 5V 不會亮」？因為每顆紅光 LED 需要約 1.9V~2.0V，3 顆串聯總共需要將近 6.0V 才能跨過導通門檻，5V 電源根本推不動！因此多顆 LED 在 5V 下應採用「各自串一顆限流電阻再並聯」。`],formulasAndRef:[{title:`克希荷夫電壓定律 (KVL 分壓檢核)`,formula:`V_supply (5.0V) = V_R (3.0V) + V_LED (2.0V)`,explanation:`用紅黑探棒跨接任一元件，就能直接讀出該元件「吃掉」了多少伏特的電壓。`}],quizTarget:{question:`請在按鈕按下 (ON) 且無故障狀態下，將紅黑探棒直接跨接在「220Ω 電阻兩端 (TP2 與 TP3)」，量出電阻吃掉的 3.00V 跨壓！`,expectedMode:`DCV`,expectedRedJack:`VOMA`,validPairs:[{red:`NODE_SW_OUT`,black:`NODE_MID`,allowReverse:!0}],hint:`請選 V⎓ (DCV) 檔，紅探棒點「TP2 (按鈕後)」、黑探棒點「TP3 (電阻/LED間)」。`}},{id:`ac-mains-safety`,chapter:`Lesson 09 · V~ / 10A`,title:`交流電壓檔 (V~) 與 10A 大電流插孔安全實務`,subtitle:`家用 110V/220V 60Hz 交流插座量測、無極性特性與 10A 插孔致命防呆`,category:`ACV`,difficulty:`進階`,guideRef:`對應 FNIRSI DMT-99 True-RMS ACV 規範與三用電表安全操作守則`,summary:`家用牆壁插座提供的是每秒正負交替 60 次的「交流電 (AC, Alternating Current)」，符號為波浪線【V~】。測量交流電時必須切換至【V~ 交流電壓檔】，因為正負極每秒互換 60 次，紅黑探棒對調讀數完全一樣（不會出現負號）。同時本課也教你認識電表最左邊的【10A 大電流插孔】，以及為什麼「量完大電流忘記把紅探棒拔回 VΩmA 孔」是電子實驗室最危險的禁忌！`,connectionType:`並聯 (Parallel)`,canCircuitBePowered:`YES (需通電量測)`,recommendedMode:`ACV`,recommendedRedJack:`VOMA`,defaultRedPointId:`AC_HOT`,defaultBlackPointId:`AC_NEUTRAL`,testPoints:[{id:`AC_HOT`,label:`交流插座短孔：火線 (Hot / Live Line, L)`,shortLabel:`插座短孔 (火線 L)`,x:615,y:195,polarityHint:`ac`,description:`台灣/北美標準三孔插座中「較短 (約 7mm)」的一字孔為火線 (Live)，對地帶有 110V~115V 60Hz 交流高壓！`},{id:`AC_NEUTRAL`,label:`交流插座長孔：中性線 / 水線 (Neutral, N)`,shortLabel:`插座長孔 (水線 N)`,x:735,y:195,polarityHint:`ac`,description:`插座中「較長 (約 9mm)」的一字孔為中性線 (Neutral)，在變電箱端與接地相連，電位接近 0V。`},{id:`AC_GND`,label:`交流插座圓孔：設備安全接地 (Earth Ground, E)`,shortLabel:`插座圓孔 (接地 E)`,x:675,y:295,polarityHint:`-`,description:`第三孔半圓形接地孔。正常配電下「火線 L ↔ 接地 E」也應量到約 115V AC，「水線 N ↔ 接地 E」則小於 2V AC。`}],simControls:[{id:`mainsRegion`,label:`切換地區市電標準 (AC Mains Standard)`,type:`select`,defaultValue:115,options:[{value:115,label:`🇹🇼 台灣 / 🇺🇸 北美家用插座 (110V~115V AC, 60Hz)`},{value:230,label:`🇪🇺 歐洲 / 🇰🇷 韓國 / 冷氣專用插座 (220V~230V AC, 50/60Hz)`},{value:24,label:`🔔 低壓交流控制變壓器次級輸出 (24V AC, 60Hz)`}]}],stepByStepGuide:[`【安全第一】測量市電前，務必先檢查紅探棒是否插在右側【VΩmA】孔（絕對不能插在左側 10A 孔！），並將旋鈕轉至黃色【V~ (交流電壓檔)】。`,`將兩支探棒分別插入【插座短孔 (火線 L)】與【插座長孔 (水線 N)】，讀取約 115.0 V~ (60Hz True-RMS)。`,`點擊【🔄 對調紅黑探棒】按鈕：觀察讀數依然是正的 115.0 V~（交流電沒有正負極之分）。`,`【致命錯誤模擬】試著把旋鈕誤轉到【V⎓ (直流電壓檔)】去量交流插座：觀察電表因為正負半週平均抵銷而顯示接近「0.00 V」的假零值！如果誤以為沒電而用手去摸就會發生觸電意外！`],principles:[`交流電有效值 (True-RMS)：家用 115V AC 代表其發熱做功能力相當於 115V 直流電，但它的正弦波瞬間峰值其實高達 115V × √2 ≈ 162.6V！`,`為什麼用直流電壓檔 (DCV) 量交流電會顯示 0V？因為 60Hz 交流電每秒有 60 個正半週與 60 個負半週，直流檔取平均值後正負剛好互相抵銷為 0V！因此驗電時務必確認螢幕上顯示的是「AC / ~」而非「DC」。`],pitfalls:[`⚠️ 嚴禁將紅探棒插在【10A】插孔時去測量插座或任何電壓源！因為 10A 插孔到 COM 孔之間在電表內部是直接連通的 0.01Ω 金屬棒（不管你的旋鈕轉在哪一檔都一樣！），插進插座會立刻引發劇烈電弧爆炸！`,`⚠️ 雙手握持探棒時，手指絕對不可超過探棒前端的「防滑護指環 (Finger Guard)」，且切勿在手部潮濕時量測市電。`],formulasAndRef:[{title:`交流正弦波有效值 (RMS) 與峰值 (Peak) 換算`,formula:`V_peak = V_RMS × √2 ≈ 1.414 × V_RMS`,explanation:`115V AC 的瞬間峰值為 163V；220V AC 的瞬間峰值則高達 311V！`}],quizTarget:{question:`請確認紅探棒插在安全孔位 (VΩmA)，轉至交流電壓檔 (V~)，量測插座「火線 L」與「水線 N」之間的交流電壓！`,expectedMode:`ACV`,expectedRedJack:`VOMA`,validPairs:[{red:`AC_HOT`,black:`AC_NEUTRAL`,allowReverse:!0}],hint:`請選 V~ (ACV) 檔、確認紅探棒在 VΩmA 孔，探棒分別接「插座短孔 (火線 L)」與「插座長孔 (水線 N)」。`}}],b=[{mode:`OFF`,shortLabel:`OFF`,symbol:`OFF`,fullName:`關機檔 (Power Off)`,angleDeg:-130,color:`#94a3b8`,badgeBg:`bg-slate-800 text-slate-300 border-slate-700`,requiredRedJack:`VOMA`,connectionRule:`待機 (Standby)`,powerRule:`皆可`,unit:``,description:`使用完畢後務必將旋鈕轉回 OFF，避免內部 9V/AAA 電池耗盡。切換檔位前也應先將探棒離開待測電路。`},{mode:`DCV`,shortLabel:`V⎓`,symbol:`V⎓`,fullName:`直流電壓檔 (DC Voltage)`,angleDeg:-95,color:`#38bdf8`,badgeBg:`bg-cyan-500/20 text-cyan-300 border-cyan-500/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`需通電 (Power ON)`,unit:`V DC`,description:`測量電池 (AA 1.5V、9V、18650)、USB 5V、麵包板 3.3V/5V 電源軌與元件跨壓。電表內阻極高 (~10MΩ)，必須「並聯」跨接在待測兩端；若紅黑探棒反接會顯示負號 (-)。`},{mode:`ACV`,shortLabel:`V~`,symbol:`V~`,fullName:`交流電壓檔 (AC Voltage True-RMS)`,angleDeg:-58,color:`#fbbf24`,badgeBg:`bg-amber-500/20 text-amber-300 border-amber-500/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`需通電 (Power ON)`,unit:`V AC`,description:`測量家用插座 (110V / 220V 60Hz) 或交流變壓器次級輸出。交流電方向隨時間正負交替，因此紅黑探棒對調數值相同（無正負極之分），但務必手握絕緣護套後端以防觸電！`},{mode:`OHM`,shortLabel:`Ω`,symbol:`Ω`,fullName:`電阻檔 (Resistance)`,angleDeg:-18,color:`#34d399`,badgeBg:`bg-emerald-500/20 text-emerald-300 border-emerald-500/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`必須斷電 (Power OFF!)`,unit:`Ω / kΩ / MΩ`,description:`測量色碼電阻、可變電阻 (Potentiometer) 或光敏電阻。電表會由內部送出微小測試電流計算阻值，因此【待測電路絕對不可通電】，且建議將電阻單獨取下量測，避免並聯迴路干擾與手指同時碰觸兩端金屬腳。`},{mode:`CONT`,shortLabel:`🔊`,symbol:`🔊`,fullName:`導通蜂鳴檔 (Continuity / Beep Mode)`,angleDeg:22,color:`#22d3ee`,badgeBg:`bg-cyan-500/20 text-cyan-200 border-cyan-400/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`必須斷電 (Power OFF!)`,unit:`Ω 🔊`,description:`電子除錯神器！當兩探棒間阻值小於約 30Ω~50Ω 時，蜂鳴器會發出「嗶—」長音。常用於測試杜邦線是否內部斷芯、麵包板哪 5 孔互相導通（Beep Game）、以及焊接是否短路或虛焊。必須斷電操作！`},{mode:`DIODE`,shortLabel:`➔|`,symbol:`➔|`,fullName:`二極體 / LED 測試檔 (Diode Test)`,angleDeg:60,color:`#f472b6`,badgeBg:`bg-rose-500/20 text-rose-300 border-rose-500/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`必須斷電 (Power OFF!)`,unit:`V (Vf)`,description:`電表內部輸出約 1mA~2mA 恆流源（開路電壓約 3.2V~3.5V），直接顯示二極體或 LED 的順向導通壓降 Vf（矽二極體約 0.65V；紅光 LED 約 1.9V、綠光約 2.1V、藍白光約 3.0~3.3V），且會讓 LED 微亮！反接則顯示 OL（逆向截止）。`},{mode:`CAP`,shortLabel:`⊣⊢`,symbol:`⊣⊢`,fullName:`電容檔 (Capacitance)`,angleDeg:95,color:`#a78bfa`,badgeBg:`bg-purple-500/20 text-purple-300 border-purple-500/40`,requiredRedJack:`VOMA`,connectionRule:`並聯 (Parallel)`,powerRule:`必須斷電 (Power OFF!)`,unit:`nF / µF`,description:`透過溫和充放電估算電容器儲存電荷能力（如 0.1µF 陶瓷電容、10µF / 1000µF 電解電容）。量測前務必先用 1kΩ 電阻跨接電容兩腳放電 5 秒！若帶著殘餘高壓直接量測，極易燒毀電表前端保護電路。`},{mode:`DCMA`,shortLabel:`mA⎓`,symbol:`mA⎓`,fullName:`直流毫安培電流檔 (DC Milliamps)`,angleDeg:130,color:`#fb923c`,badgeBg:`bg-orange-500/20 text-orange-300 border-orange-500/40`,requiredRedJack:`VOMA`,connectionRule:`串聯 (In Series)`,powerRule:`需通電 (Power ON)`,unit:`mA`,description:`測量 LED 迴路或微控制器工作電流（上限通常為 200mA~400mA，內建自復或玻璃保險絲）。必須將電路「剪開（斷開）」，讓電流從紅探棒流進電表、再從黑探棒流出回到負載（串聯）！絕對禁止直接跨接在電源正負極！`},{mode:`DC10A`,shortLabel:`10A⎓`,symbol:`10A⎓`,fullName:`直流大電流檔 (DC 10A High Current)`,angleDeg:162,color:`#ef4444`,badgeBg:`bg-red-500/20 text-red-300 border-red-500/4
